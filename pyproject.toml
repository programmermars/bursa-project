[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bursa-report-rag"
version = "0.1.0"
description = "Page-cited RAG over Malaysian listed companies' annual reports (local Ollama or free Groq)"
authors = [{ name = "Chong Jia You" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5",
  "pypdf>=4.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.3",
  "numpy>=1.24",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "streamlit>=1.50",
]

[project.optional-dependencies]
hf = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
