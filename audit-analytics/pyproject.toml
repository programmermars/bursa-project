[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditkit"
version = "0.1.0"
description = "Audit data analytics (CAATs) on plantation-company transactions, scored against planted irregularities"
authors = [{ name = "Chong Jia You" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
auditkit = "auditkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
